<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7b1530"><link rel="manifest" href="manifest.webmanifest">
<title>Marathi Status Maker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#fff7f8;color:#24151a}
header{background:#7b1530;color:white;padding:18px;text-align:center}h1{margin:0;font-size:23px}
nav{display:flex;gap:7px;padding:10px;overflow:auto;background:#fff;position:sticky;top:0}
button{border:0;border-radius:10px;padding:11px 14px;background:#7b1530;color:white;font-weight:600}
nav button{white-space:nowrap}main{padding:14px;max-width:700px;margin:auto}
.panel{background:white;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 10px #0000000d}
.status{padding:12px;border-bottom:1px solid #eee;line-height:1.6}
.small{background:#f3e8eb;color:#5d1a2e;margin:4px}
input,textarea,select{width:100%;padding:12px;border:1px solid #d9cbd0;border-radius:9px;margin:7px 0;font:inherit}
textarea{min-height:90px}canvas{width:100%;max-width:360px;background:#7b1530;border-radius:12px;display:block;margin:10px auto}
video{width:100%;max-height:360px;background:#111;border-radius:10px}
.hidden{display:none}.muted{color:#76666c;font-size:13px}
</style>
</head>
<body>
<header><h1>मराठी स्टेटस मेकर</h1><div>तुमचे आवडते स्टेटस तयार करा आणि शेअर करा</div></header>
<nav>
<button onclick="show('statuses')">स्टेटस</button><button onclick="show('poster')">पोस्टर</button><button onclick="show('video')">व्हिडिओ</button>
</nav>
<main>
<section id="statuses">
<div class="panel"><b>कॅटेगरी निवडा</b><div id="cats"></div></div>
<div class="panel"><div id="statusList"></div></div>
</section>
<section id="poster" class="hidden">
<div class="panel"><h3>पोस्टर तयार करा</h3>
<input id="photo" type="file" accept="image/*"><textarea id="quote" placeholder="तुमचा मराठी मजकूर लिहा"></textarea>
<label>बॅकग्राउंड रंग</label><input id="bg" type="color" value="#7b1530">
<button onclick="makePoster()">पोस्टर तयार करा</button><canvas id="posterCanvas" width="720" height="900"></canvas>
<button onclick="downloadPoster()">PNG डाउनलोड करा</button>
</div></section>
<section id="video" class="hidden">
<div class="panel"><h3>तुमचा व्हिडिओ पाहा</h3><input id="videoFile" type="file" accept="video/*"><video id="player" controls></video>
<p class="muted">फोनमधून स्वतःचा व्हिडिओ निवडा. इथे तयार ऑनलाइन व्हिडिओ लायब्ररी नाही.</p>
</div></section>
</main>
<script>
const data={
'Attitude':['स्वतःची किंमत ओळखा, जग आपोआप ओळखेल.','शांत आहे म्हणजे कमजोर नाही.'],
'Love':['मनापासून जपलेली माणसं नशिबाने मिळतात.','तुझं हसूच माझ्यासाठी खास आहे.'],
'Motivation':['वेळ लागेल, पण मेहनत वाया जाणार नाही.','आजचा संघर्ष उद्याची ताकद आहे.'],
'Emotional':['काही गोष्टी मनातच राहिलेल्या बऱ्या.','हसणाऱ्या चेहऱ्यामागेही वेदना असतात.'],
'Self Respect':['जिथे मान नाही, तिथे थांबायचं नाही.','स्वाभिमानापेक्षा मोठं काहीच नाही.'],
'Friendship':['खरा मित्र वेळेवर ओळखू येतो.','मैत्री शब्दांनी नाही, साथीनं कळते.']
};
let current=Object.keys(data)[0];
const cats=document.getElementById('cats'), list=document.getElementById('statusList');
Object.keys(data).forEach(c=>{let b=document.createElement('button');b.className='small';b.textContent=c;b.onclick=()=>{current=c;render()};cats.append(b)});
function render(){list.innerHTML='';data[current].forEach(s=>{let d=document.createElement('div');d.className='status';let p=document.createElement('div');p.textContent=s;let b=document.createElement('button');b.textContent='कॉपी';b.onclick=()=>navigator.clipboard?.writeText(s).then(()=>alert('कॉपी झाले!')).catch(()=>alert(s));let sh=document.createElement('button');sh.textContent='शेअर';sh.style.marginLeft='8px';sh.onclick=()=>navigator.share? navigator.share({text:s}):alert(s);d.append(p,b,sh);list.append(d)})}
render();
function show(id){['statuses','poster','video'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id))}
let selectedPhoto=null;document.getElementById('photo').onchange=e=>{let f=e.target.files[0];if(f){selectedPhoto=new Image();selectedPhoto.onload=()=>makePoster();selectedPhoto.src=URL.createObjectURL(f)}};
function makePoster(){let c=document.getElementById('posterCanvas'),x=c.getContext('2d');x.fillStyle=document.getElementById('bg').value;x.fillRect(0,0,c.width,c.height);if(selectedPhoto){let r=Math.max(c.width/selectedPhoto.width,c.height/selectedPhoto.height);let w=selectedPhoto.width*r,h=selectedPhoto.height*r;x.drawImage(selectedPhoto,(c.width-w)/2,(c.height-h)/2,w,h);x.fillStyle='#0008';x.fillRect(0,0,c.width,c.height)}x.fillStyle='white';x.textAlign='center';x.font='bold 46px sans-serif';let words=(document.getElementById('quote').value||'तुमचा मराठी स्टेटस').split(' '),lines=[],line='';words.forEach(w=>{let t=line?line+' '+w:w;if(x.measureText(t).width>620){lines.push(line);line=w}else line=t});if(line)lines.push(line);let y=c.height/2-(lines.length-1)*58/2;lines.forEach(l=>{x.fillText(l,c.width/2,y);y+=58});x.font='24px sans-serif';x.fillText('Marathi Status Maker',c.width/2,850)}
function downloadPoster(){let a=document.createElement('a');a.download='marathi-status.png';a.href=document.getElementById('posterCanvas').toDataURL('image/png');a.click()}
document.getElementById('videoFile').onchange=e=>{let f=e.target.files[0];if(f)document.getElementById('player').src=URL.createObjectURL(f)};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
